name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## $VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' docs/CHANGELOG.md > notes.md
          if [ "$(grep -c '[^[:space:]]' notes.md)" -lt 2 ]; then
            echo "::error::docs/CHANGELOG.md has no notes for $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  release:
    needs: [ci, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: notes

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
